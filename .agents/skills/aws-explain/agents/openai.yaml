interface:
  display_name: "AWS Explain"
  short_description: "Chọn đáp án AWS đúng, giữ vị trí option gốc, đối chiếu doc AWS chính thức, lưu Q&A vào beads."
  default_prompt: "Use $aws-explain to verify AWS answers with MCP, prioritizing aws-knowledge and falling back to aws-documentation-mcp-server for docs-first lookups when aws-knowledge is rate limited or unavailable; preserve original option positions (for example #1, #4), explain each option, and save the Q&A to beads database."
dependencies:
  tools:
    - type: "mcp"
      value: "aws-knowledge"
      description: "AWS documentation verification MCP server"
      transport: "streamable_http"
      url: "https://knowledge-mcp.global.api.aws"
    - type: "mcp"
      value: "aws-documentation-mcp-server"
      description: "Fallback AWS documentation MCP server for docs-first lookups"
policy:
  allow_implicit_invocation: true
