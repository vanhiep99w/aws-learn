interface:
  display_name: "AWS Explain"
  short_description: "Chọn đáp án AWS đúng, giữ vị trí option gốc, đối chiếu doc AWS và repo."
  default_prompt: "Use $aws-explain to verify AWS answers with aws-knowledge MCP, preserve original option positions (for example #1, #4), explain each option, and check whether the current repo docs already cover the correct answer."
dependencies:
  tools:
    - type: "mcp"
      value: "aws-knowledge"
      description: "AWS documentation verification MCP server"
      transport: "streamable_http"
      url: "https://knowledge-mcp.global.api.aws"
policy:
  allow_implicit_invocation: true
